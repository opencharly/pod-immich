immich:
    candy:
        description: |
            Immich self-hosted photo and video management server on port 2283 with its
            machine-learning backend on port 3003 in the same image — face recognition,
            smart search and OCR run in-process, no second image.
            Builds the Immich Node server from source with pnpm into /opt/immich/server,
            the Vite web UI into /build/www, the plugin-core Extism WASM plugin into
            /build/plugins/immich-plugin-core, and the reverse-geocoding geodata into
            /build/geodata; installs a PostgreSQL-aware startup wrapper and an idempotent
            DB-migration wrapper; provisions the Python machine-learning virtualenv
            (/opt/immich/machine-learning/.venv) from the pinned uv.lock with the CUDA
            ONNX Runtime extra and supervises it as immich-ml on port 3003. Library,
            cache, import, external media and ML models live under ~/.immich. The
            behaviour is verifiable as the built server bundle, the web build, the WASM
            plugin, the geodata set, the image-codec toolchain, the seeded init SQL, the
            CUDA execution provider in the ML venv, and live /api/server/ping on 2283
            plus /ping on 3003.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.314.0710'
            - '@github.com/opencharly/layer-nodejs:v2026.314.0707'
            - '@github.com/opencharly/pod-postgresql:v2026.327.1758'
            - '@github.com/opencharly/pod-redis:v2026.327.1753'
            - '@github.com/opencharly/layer-ffmpeg:v2026.314.0706'
        env:
            # start.sh logs this; it is the tag the artifacts were built from.
            IMMICH_SOURCE_REF: "v3.4.2"
            IMMICH_HOST: "0.0.0.0"
            IMMICH_PORT: "2283"
            IMMICH_MEDIA_LOCATION: "~/.immich/library"
            # The ML backend is part of THIS image, so the server talks to it on the
            # loopback port the supervised immich-ml service binds. Immich's own
            # default (http://immich-machine-learning:3003) names the upstream
            # compose service and does not resolve here.
            IMMICH_MACHINE_LEARNING_ENABLED: "true"
            IMMICH_MACHINE_LEARNING_URL: "http://127.0.0.1:3003"
            MACHINE_LEARNING_HOST: "0.0.0.0"
            MACHINE_LEARNING_PORT: "3003"
            MACHINE_LEARNING_WORKERS: "1"
            MACHINE_LEARNING_WORKER_TIMEOUT: "120"
            TRANSFORMERS_CACHE: "~/.immich/models"
            SHARP_FORCE_GLOBAL_LIBVIPS: "1"
            POSTGRES_USER: "immich"
            POSTGRES_DB: "immich"
            # The database is the composed `pod-postgresql` candy, whose entrypoint
            # starts the cluster with `-c listen_addresses=''` — it accepts clients on
            # the UNIX socket `$HOME/.postgresql` and on nothing else, so a TCP
            # hostname can never connect. This variable is the pre-exec default the
            # startup wrapper replaces with the real `$HOME/.postgresql` at runtime
            # (see immich-server-start.sh); it is deliberately NOT `127.0.0.1`.
            DB_HOSTNAME: "~/.postgresql"
            DB_PORT: "5432"
            DB_USERNAME: "immich"
            DB_DATABASE_NAME: "immich"
            REDIS_HOSTNAME: "127.0.0.1"
            REDIS_PORT: "6379"
            NODE_ENV: "production"
        var:
            # The release the artifacts are built from. It lives in var: (not env:)
            # because `download:` templates substitute against var: only; var: values are
            # emitted as ENV as well, so the build steps see it too.
            IMMICH_VERSION: "v3.4.2"
            # Every toolchain version below is the one immich v3.4.2 itself pins
            # (root package.json packageManager, .nvmrc, mise.toml), so a version bump
            # here is a coordinated read of those three files — not a guess:
            #   node 24.22.1 (nodejs candy supplies the distro node) / pnpm 12.15.0
            #   extism-js (js-pdk) v1.7.0 + binaryen version_124  → plugin-core WASM
            #   uv 0.8.15 (the version upstream's machine-learning/Dockerfile ships)
            # NAMESPACED on purpose. A candy's `var:` values are exported as image ENV, so
            # an un-namespaced pnpm pin here is GLOBAL, and `layer-nodejs` exports its own
            # pin under that same un-namespaced name — its measurement check reads it at
            # probe time. Inside an image composing both, this candy's value won and reded
            # that check (measured: distro-cachyos check-cachyos-immich-pod, 1 failing
            # check of 123, "pnpm 12.15.0 is UNMEASURED"). The name is namespaced to this
            # candy; the install is unchanged.
            IMMICH_PNPM_VERSION: "12.15.0"
            EXTISM_JS_VERSION: "1.7.0"
            BINARYEN_VERSION: "124"
            UV_VERSION: "0.8.15"
            # Reverse-geocoding data: the geoJSON is fetched from a TAG, never master,
            # so the artifact set is reproducible (immich v3.4.2 ships v5.1.2).
            NATURAL_EARTH_TAG: "v5.1.2"
        distro:
            arch:
                # Arch image-lib names differ from Fedora: libvips (bundles headers — no
                # -devel split), libraw, perl-image-exiftool (lowercase); gcc includes g++.
                package:
                    - libvips
                    - libheif
                    - libraw
                    - perl-image-exiftool
                    - gcc
                    - make
                    - unzip
                    - curl
                    - python
            fedora:
                package:
                    - vips
                    - vips-devel
                    - perl-Image-ExifTool
                    - libheif
                    - LibRaw
                    - gcc-c++
                    - make
                    - unzip
                    - curl
                    - python3
        port:
            - 2283
            - 3003
        # Expose the Immich HTTP API URL to every other container that opts in via
        # env_accept: [IMMICH_API_URL]. Plan §4.3. The templated value resolves to
        # "http://<container>:2283/api" at charly config time for the base instance and
        # to the instance-scoped container name for instances. The consumer is hermes,
        # which declares this env var in its env_accept. openwebui deliberately does
        # NOT: Open Web UI has no immich integration, so it accepted this value without
        # ever reading it — dead declarations, removed in opencharly/pod-openwebui#15.
        env_provide:
            IMMICH_API_URL: "http://{{.ContainerName}}:2283/api"
        env_accept:
            - name: IMMICH_API_URL
              description: "Self-accept so the immich container itself sees its own API URL (used by entrypoint/health scripts)"
        # Immich API key for programmatic access. Generated in the Immich web UI
        # after first-run setup, then stored once in the credential backend via:
        #
        #   charly secrets set charly/api-key/immich <key>
        #
        # hermes declares the same secret_accept entry with the same key path, so one
        # `charly secrets set` populates both consumers.
        secret_accept:
            - name: IMMICH_API_KEY
              description: "Immich API key for programmatic access (generated in the Immich admin UI after first-run)"
              key: charly/api-key/immich
        volume:
            - name: library
              path: "~/.immich/library"
            - name: cache
              path: "~/.immich/cache"
            - name: import
              path: "~/.immich/import"
            - name: external
              path: "~/.immich/external"
            # The ML models the backend downloads on first use (CLIP, face, OCR).
            - name: models
              path: "~/.immich/models"
        secret:
            - name: db-password
              env: DB_PASSWORD
            - name: db-password
              env: POSTGRES_PASSWORD
        route:
            host: "immich.localhost"
            port: 2283
        service:
            - name: immich-db-init
              exec: /usr/local/bin/immich-db-migrate.sh
              restart: no
              priority: 15
              start_sec: 0
              exit_code: "0"
              enable: true
              scope: system
            - name: immich-server
              exec: /usr/local/bin/immich-server-start.sh
              restart: always
              working_directory: /opt/immich/server
              priority: 30
              enable: true
              scope: system
            - name: immich-ml
              exec: /opt/immich/ml-run.sh
              # immich_ml's NonPrefixedSettings reads IMMICH_HOST / IMMICH_PORT
              # (machine-learning/immich_ml/config.py — defaults "[::]" / 3003), NOT the
              # MACHINE_LEARNING_* prefix. This image sets IMMICH_PORT=2283 for the server,
              # so without this override the ML backend binds the server's port and
              # crash-loops on "address already in use".
              env:
                IMMICH_HOST: 0.0.0.0
                IMMICH_PORT: "3003"
              restart: always
              working_directory: /opt/immich/machine-learning
              priority: 40
              enable: true
              scope: system
        plan:
            # --- toolchain -----------------------------------------------------------------
            - run: install the pnpm version immich v3.4.2 pins, beside the image's own pnpm
              run_as: root
              command: |
                set -o pipefail
                case "${BUILD_ARCH}" in
                  x86_64)  PNPM_ARCH="x64" ;;
                  aarch64) PNPM_ARCH="arm64" ;;
                  *) echo "Unsupported arch: ${BUILD_ARCH}"; exit 1 ;;
                esac
                # pnpm 12 publishes a tarball (`pnpm` launcher + its dist/ tree), not the
                # bare single-file binary the 10.x line shipped.
                mkdir -p /opt/immich/pnpm
                curl -fsSL --retry 3 --retry-delay 2 \
                  "https://github.com/pnpm/pnpm/releases/download/v${IMMICH_PNPM_VERSION}/pnpm-linux-${PNPM_ARCH}.tar.gz" \
                  | tar xz -C /opt/immich/pnpm
                chmod 0755 /opt/immich/pnpm/pnpm
                /opt/immich/pnpm/pnpm --version
            - run: install the uv package manager that builds the machine-learning virtualenv
              # The release nests `uv` and `uvx` under an arch-prefixed directory, so
              # strip_components: 1 lands both flat in /usr/local/bin (the archive holds
              # nothing else). Do NOT pair extract_include with strip_components: tar
              # matches the include against the PRE-strip member path, so
              # `extract_include: [uv]` never matches `uv-<triple>/uv` and the step dies
              # with "tar: uv: Not found in archive".
              download: "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${BUILD_ARCH}-unknown-linux-gnu.tar.gz"
              extract: tar.gz
              strip_components: 1
              to: /usr/local/bin
              mode: "0755"
              run_as: root
            - run: fetch the immich source release
              download: "https://github.com/immich-app/immich/archive/refs/tags/${IMMICH_VERSION}.tar.gz"
              extract: tar.gz
              to: /tmp/immich-src
              strip_components: 1
              run_as: root
            # --- plugin-core WASM + workspace packages -------------------------------------
            - run: install the extism-js PDK compiler and the binaryen wasm toolchain
              run_as: root
              command: |
                set -o pipefail
                curl -fsSL --retry 3 --retry-delay 2 \
                  "https://github.com/extism/js-pdk/releases/download/v${EXTISM_JS_VERSION}/extism-js-${BUILD_ARCH}-linux-v${EXTISM_JS_VERSION}.gz" \
                  | gunzip > /usr/local/bin/extism-js
                chmod 0755 /usr/local/bin/extism-js
                curl -fsSL --retry 3 --retry-delay 2 \
                  "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-${BUILD_ARCH}-linux.tar.gz" \
                  | tar xz -C /tmp
                for b in /tmp/binaryen-version_${BINARYEN_VERSION}/bin/*; do
                  ln -sf "$b" "/usr/local/bin/$(basename "$b")"
                done
                test -x /usr/local/bin/extism-js
            - run: build the sdk, plugin SDK and core plugin, and stage the WASM plugin artifact
              run_as: root
              command: |
                export npm_config_cache=/tmp/npm-root-cache npm_config_store_dir=/tmp/pnpm-store
                cd /tmp/immich-src
                /opt/immich/pnpm/pnpm --filter @immich/sdk --filter @immich/plugin-sdk --filter @immich/plugin-core install --frozen-lockfile
                /opt/immich/pnpm/pnpm --filter @immich/sdk --filter @immich/plugin-sdk --filter @immich/plugin-core build
                mkdir -p /build/plugins/immich-plugin-core
                cp -r packages/plugin-core/dist /build/plugins/immich-plugin-core/dist
                cp packages/plugin-core/manifest.json /build/plugins/immich-plugin-core/manifest.json
            # --- server -------------------------------------------------------------------
            - run: build the immich server bundle and deploy the production tree to /opt/immich
              run_as: root
              command: |
                export npm_config_cache=/tmp/npm-root-cache npm_config_store_dir=/tmp/pnpm-store
                cd /tmp/immich-src
                /opt/immich/pnpm/pnpm --filter immich install --frozen-lockfile
                /opt/immich/pnpm/pnpm --filter immich build
                /opt/immich/pnpm/pnpm --filter immich --prod --no-optional deploy /opt/immich/server
                # sharp 0.35 no longer links the base image's global libvips during
                # `pnpm deploy`; upstream rebuilds the deployed copy against it.
                SHARP_FORCE_GLOBAL_LIBVIPS=true \
                  /opt/immich/pnpm/pnpm --config.verify-deps-before-run=false \
                    --dir /opt/immich/server/node_modules/sharp exec npm run build
            - run: build the Vite web UI into the runtime web root
              run_as: root
              command: |
                export npm_config_cache=/tmp/npm-root-cache npm_config_store_dir=/tmp/pnpm-store
                cd /tmp/immich-src
                # web resolves "#i18n/*" to ../i18n/*, so the build needs the i18n tree.
                /opt/immich/pnpm/pnpm --filter immich-web install --frozen-lockfile
                /opt/immich/pnpm/pnpm --filter immich-web build
                cp -r /tmp/immich-src/web/build /build/www
            # --- reverse geocoding data ---------------------------------------------------
            - run: fetch the reverse-geocoding geodata files
              download: "https://download.geonames.org/export/dump/admin1CodesASCII.txt"
              to: /build/geodata/admin1CodesASCII.txt
              mode: "0444"
              run_as: root
            - run: fetch the second-level administrative-code geodata file
              download: "https://download.geonames.org/export/dump/admin2Codes.txt"
              to: /build/geodata/admin2Codes.txt
              mode: "0444"
              run_as: root
            - run: fetch the country-info geodata file immich v3 reads for country names
              download: "https://download.geonames.org/export/dump/countryInfo.txt"
              to: /build/geodata/countryInfo.txt
              mode: "0444"
              run_as: root
            - run: fetch the cities geodata archive
              download: "https://download.geonames.org/export/dump/cities500.zip"
              to: /build/geodata/cities500.zip
              run_as: root
            - run: fetch the Natural Earth country outline the map layer renders
              download: "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/${NATURAL_EARTH_TAG}/geojson/ne_10m_admin_0_countries.geojson"
              to: /build/geodata/ne_10m_admin_0_countries.geojson
              mode: "0444"
              run_as: root
            - run: unpack the cities file and stamp the geodata set and build lockfile
              run_as: root
              command: |
                cd /build/geodata
                unzip -o cities500.zip
                rm -f cities500.zip
                date -Iseconds | tr -d '\n' > geodata-date.txt
                # /build/build-lock.json is read by ServerInfoRepository; the shape is
                # {sources:[{name,version}],packages:[{name,version}]} and each entry is
                # looked up by name. An empty pair of lists is a valid lockfile with
                # nothing claimed, instead of a missing file that logs a warning on every
                # start.
                printf '{"sources":[],"packages":[]}\n' > /build/build-lock.json
                ls -l /build/geodata /build/build-lock.json
            # --- machine-learning backend -------------------------------------------------
            - run: provision the machine-learning virtualenv with the CUDA onnx runtime extra
              run_as: root
              # uv keeps its downloads and managed interpreters in a cache; mount it so a
              # rebuild of this candy does not re-fetch ~2.5GB of CUDA wheels.
              cache:
                - /var/cache/charly-uv
              command: |
                # The managed CPython must live OUTSIDE root's home: uv's default
                # (~/.local/share/uv/python) is mode 0700 under /root, so the venv's
                # `bin/python` symlink is unreadable to the image's uid-1000 user and every
                # probe dies with exit 126 while the build itself succeeds.
                export UV_PYTHON_INSTALL_DIR=/opt/immich/python
                export UV_CACHE_DIR=/var/cache/charly-uv
                mkdir -p /opt/immich/machine-learning /opt/immich/python
                uv venv --python 3.13 /opt/immich/machine-learning/.venv
                chmod -R a+rX /opt/immich/python
                cd /tmp/immich-src/machine-learning
                # `cuda` is an OPTIONAL-DEPENDENCY (--extra); `cuda-libs` is a
                # DEPENDENCY-GROUP (--group) — passing it as --extra fails with
                # "Extra `cuda-libs` is not defined in the project's
                # optional-dependencies table".
                VIRTUAL_ENV=/opt/immich/machine-learning/.venv uv sync --frozen --no-dev \
                  --no-editable --active --link-mode copy \
                  --extra cuda --group cuda-libs
            - run: remove the build source tree
              run_as: root
              command: rm -rf /tmp/immich-src
            # --- database bootstrap + wrappers --------------------------------------------
            - run: write the Postgres init script that seeds the extensions immich requires
              write: /docker-entrypoint-initdb.d/01-immich-extensions.sql
              run_as: root
              mode: "0644"
              content: |
                CREATE EXTENSION IF NOT EXISTS vector;
                CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
                CREATE EXTENSION IF NOT EXISTS cube;
                CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
            - run: write the idempotent database-migration wrapper
              write: /usr/local/bin/immich-db-migrate.sh
              run_as: root
              mode: "0755"
              content: |
                #!/bin/bash
                set -euo pipefail
                HOME=${HOME:-/home/user}
                SOCKET_DIR="$HOME/.postgresql"
                POSTGRES_USER=${POSTGRES_USER:-immich}
                POSTGRES_DB=${POSTGRES_DB:-immich}

                # Wait for PostgreSQL (up to 600s — WAL recovery after heavy ops can take minutes)
                for i in $(seq 1 600); do
                    pg_isready -h "$SOCKET_DIR" -U "$POSTGRES_USER" >/dev/null 2>&1 && break
                    sleep 1
                done
                if ! pg_isready -h "$SOCKET_DIR" -U "$POSTGRES_USER" >/dev/null 2>&1; then
                    echo "PostgreSQL timed out after 600s" >&2
                    exit 1
                fi

                # Ensure core extensions (idempotent — safe on every startup).
                # earthdistance is built on cube, which CASCADE pulls in.
                psql -h "$SOCKET_DIR" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
                    -c "CREATE EXTENSION IF NOT EXISTS vector;" \
                    -c "CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;"

                # VectorChord if available (conditional — works with or without vectorchord layer)
                if psql -h "$SOCKET_DIR" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
                    "SELECT 1 FROM pg_available_extensions WHERE name = 'vchord'" | grep -q 1; then
                    psql -h "$SOCKET_DIR" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
                        -c "CREATE EXTENSION IF NOT EXISTS vchord CASCADE;"
                    echo "VectorChord extension ensured"
                else
                    echo "VectorChord not available — skipping"
                fi
            - run: write the machine-learning run wrapper that puts the venv CUDA wheels on the loader path
              write: /opt/immich/ml-run.sh
              run_as: root
              mode: "0755"
              content: |
                #!/bin/bash
                # The `cuda-libs` dependency group installs the CUDA 12 runtime wheels INSIDE
                # the venv (site-packages/nvidia/<pkg>/lib). Those directories are not on the
                # default loader path, so `import onnxruntime` fails with
                # "libcudart.so.12: cannot open shared object file" until they are. An
                # CachyOS ships CUDA 13, which onnxruntime-gpu 1.27 cannot load,
                # so the venv carries its own cu12 stack and this wrapper points the loader at
                # it. It is the ONE implementation: the supervised service and the CUDA
                # provider probe both come through here.
                set -euo pipefail
                VENV=/opt/immich/machine-learning/.venv
                PY="${VENV}/bin/python"
                # immich_ml starts its worker by exec'ing the bare `gunicorn` from PATH
                # (immich_ml/__main__.py), so the venv must be ACTIVE — exactly why
                # upstream's ML image exports PATH=/opt/venv/bin:$PATH. Without this the
                # exec resolves the base image's system python and dies with
                # "/usr/sbin/python: No module named gunicorn".
                export PATH="${VENV}/bin:${PATH}"
                SITE="$("$PY" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
                libs=""
                while IFS= read -r d; do
                  libs="${d}${libs:+:${libs}}"
                done < <(find "${SITE}" -maxdepth 4 -type d -name lib -path '*/nvidia/*' 2>/dev/null || true)
                export LD_LIBRARY_PATH="${libs}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
                if [ "$#" -eq 0 ]; then
                  set -- "$PY" -m immich_ml
                fi
                exec "$@"
            - run: write the PostgreSQL-aware server startup wrapper
              write: /usr/local/bin/immich-server-start.sh
              run_as: root
              mode: "0755"
              content: |
                #!/bin/bash
                # The composed `pod-postgresql` starts its cluster with
                # `-c listen_addresses=''`: it serves the UNIX socket and binds no TCP
                # port at all, so the server must dial the socket rather than a loopback
                # TCP port (which nothing listens on). The readiness probe below already
                # uses the socket; point the client at the same place, resolved from HOME
                # so it follows the deploy user. This file therefore mentions no loopback
                # host anywhere — the negative assertion below would refuse it.
                SOCKET_DIR="${HOME:-/home/user}/.postgresql"
                until pg_isready -h "$SOCKET_DIR" -U "${POSTGRES_USER:-immich}" >/dev/null 2>&1; do
                    sleep 1
                done
                export DB_HOSTNAME="$SOCKET_DIR"
                # server/package.json is "type": "module"; the ESM entry needs its
                # extension spelled out.
                exec node /opt/immich/server/dist/main.js
            - run: create the per-user media and model directories
              mkdir: "${HOME}/.immich/library"
              run_as: "${USER}"
            - run: create the per-user thumbnail cache directory
              mkdir: "${HOME}/.immich/cache"
              run_as: "${USER}"
            - run: create the per-user upload staging directory
              mkdir: "${HOME}/.immich/import"
              run_as: "${USER}"
            - run: create the per-user external-library directory
              mkdir: "${HOME}/.immich/external"
              run_as: "${USER}"
            - run: create the per-user machine-learning model cache directory
              mkdir: "${HOME}/.immich/models"
              run_as: "${USER}"
            # --- build-scope probes -------------------------------------------------------
            - check: the Immich Node server bundle is built into /opt/immich/server
              file:
                file: /opt/immich/server/dist/main.js
                exists: true
            - check: the built web UI is staged into the runtime web root
              file:
                file: /build/www/index.html
                exists: true
            - check: the core plugin WASM artifact and its manifest are staged
              file:
                file: /build/plugins/immich-plugin-core/dist/plugin.wasm
                exists: true
            - check: the reverse-geocoding geodata set carries the country-info file v3 reads
              file:
                file: /build/geodata/countryInfo.txt
                exists: true
            - check: the geodata set is stamped so the map layer can detect a data refresh
              file:
                file: /build/geodata/geodata-date.txt
                exists: true
            - check: the PostgreSQL-aware server startup wrapper is installed and executable
              file:
                file: /usr/local/bin/immich-server-start.sh
                exists: true
                mode: "0755"
            # The composed pod-postgresql binds no TCP port (`listen_addresses=''`), so
            # the wrapper MUST hand the server the socket directory. This assertion is
            # what makes a future regression to a loopback hostname RED at image-check
            # time instead of a crash-loop found only by a live pod bed.
            # The fragments below carry ZERO `$` on purpose: an assert-only step
            # resolves the runner's auto-exported variables, so a literal `${...}` or
            # `$NAME` in the assertion text would be substituted (or mark the step
            # DEAD), never compared. The NEGATIVE arm is what makes this assertion
            # able to fail on the regression it exists for: a `contains` of generic
            # fragments is satisfied by `export DB_HOSTNAME="127.0.0.1"` too, so
            # without `not_contains` the check would stay green while the server went
            # back to the ECONNREFUSED crash-loop.
            # POSITIVE arm: the socket wiring is present (plain string fragments, no
            # `$` — an assert-only step substitutes the runner's auto-exported
            # variables, so variable syntax here would be compared against its VALUE or
            # mark the step DEAD).
            - check: the server wrapper points the database client at the composed candy's unix socket
              id: immich-server-db-unix-socket
              file:
                file: /usr/local/bin/immich-server-start.sh
                contains:
                    - 'export DB_HOSTNAME='
                    - 'SOCKET_DIR='
                    - '/.postgresql'
            # NEGATIVE arm: the value itself. A `contains` of fragments is satisfied by
            # `export DB_HOSTNAME="127.0.0.1"` too, so the positive arm alone would stay
            # green through exactly the regression this change exists to prevent. The
            # pattern covers EVERY loopback spelling a client can be handed — the
            # dotted-quad family (127.0.0.1, 127.0.0.2, the whole /8), `localhost` and
            # the IPv6 `::1` — because any of them lands on a TCP port the socket-only
            # database does not bind, and refusing one spelling while accepting
            # `localhost` would be the same "looks like a guard" defect one level down.
            # Negated in the shell: a match turns the step RED. ZERO `$` in the pattern,
            # for the same substitution reason as above.
            - check: the server wrapper never hands the database client a loopback address
              id: immich-server-db-no-loopback
              command: |
                ! grep -Eq 'localhost|::1|127[.][0-9]+[.][0-9]+[.][0-9]+' /usr/local/bin/immich-server-start.sh
              exit_status: 0
            - check: the idempotent DB-migration wrapper is installed and executable
              file:
                file: /usr/local/bin/immich-db-migrate.sh
                exists: true
                mode: "0755"
            - check: the libvips image-processing library is installed for thumbnailing and transcoding
              package:
                package: vips
                package_map:
                    arch: libvips
                    fedora: vips
                installed: true
            - check: the Postgres init script seeds the pgvector extension Immich requires
              file:
                file: /docker-entrypoint-initdb.d/01-immich-extensions.sql
                exists: true
                contains: "CREATE EXTENSION IF NOT EXISTS vector"
            - check: the machine-learning virtualenv ships a python interpreter
              file:
                file: /opt/immich/machine-learning/.venv/bin/python
                exists: true
            - check: the immich_ml inference module is installed into the machine-learning virtualenv
              id: immich-ml-module-installed
              exit_status: 0
              command:
                command: /opt/immich/machine-learning/.venv/bin/python -c 'import immich_ml'
                in_container: true
            - check: the CUDA execution provider is available to onnxruntime in the ML virtualenv
              id: immich-ml-cuda-provider
              exit_status: 0
              stdout:
                - contains: CUDAExecutionProvider
              command:
                command: /opt/immich/ml-run.sh /opt/immich/machine-learning/.venv/bin/python -c 'import onnxruntime; print("\n".join(onnxruntime.get_available_providers()))'
                in_container: true
            - check: immich-db-init is declared as a one-shot service that must exit 0
              id: immich-db-init-declared
              file:
                file: /usr/local/bin/immich-db-migrate.sh
                exists: true
            # --- runtime probes -----------------------------------------------------------
            - check: service=immich-server
              id: immich-server-running
              context:
                - runtime
              service:
                service: immich-server
                running: true
            - check: the supervised immich-ml service is running
              id: immich-ml-service-running
              context:
                - runtime
              service:
                service: immich-ml
                running: true
            - check: http=http://127.0.0.1:${HOST_PORT:2283}/api/server/ping
              id: immich-http-ping
              timeout: 10s
              context:
                - runtime
              http:
                http: http://127.0.0.1:${HOST_PORT:2283}/api/server/ping
                status: 200
                body:
                    - contains: "pong"
            - check: command=curl -fsS http://127.0.0.1:3003/ping
              id: immich-ml-internal-ping
              exit_status: 0
              timeout: 10s
              stdout:
                - contains: pong
              context:
                - runtime
              command:
                command: curl -fsS http://127.0.0.1:3003/ping
                in_container: true
            - check: addr=127.0.0.1:${HOST_PORT:2283}
              id: immich-port-reachable
              timeout: 5s
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:2283}
                reachable: true
            - agent-check: the web UI presents a usable first-run / login experience

immich-skill:
    skill:
        name: immich
        family: immich
        owner: immich

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
immich-layer-skill:
    skill:
        name: immich-layer
        family: immich
        owner: immich
